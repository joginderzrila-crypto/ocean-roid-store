services:
  - type: web
    name: ocean-roid-store
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ocean-roid-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: INSTAGRAM_URL
        sync: false
databases:
  - name: ocean-roid-db
    plan: 0.1c-256mb

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocean Roid Admin</title><style>:root{--blue:#4f81bd;--ink:#172033;--muted:#687385;--line:#dfe6ee;--bg:#f5f8fc}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 40px #17203312}.login .card{width:min(420px,100%)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;margin:6px 0 12px}.btn{background:var(--ink);color:#fff;border:0;padding:11px 16px;border-radius:9px}.app{display:none;min-height:100vh}.side{position:fixed;width:230px;height:100vh;background:#172033;color:#fff;padding:25px 16px}.side h2{margin:0 0 25px}.side button{display:block;width:100%;text-align:left;background:none;color:#d9e1ea;border:0;padding:12px;border-radius:8px;margin:4px 0}.side button.active,.side button:hover{background:#ffffff16}.main{margin-left:230px;padding:30px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:30px;margin-top:8px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--muted)}.pill{padding:5px 9px;border-radius:99px;background:#edf3f9;font-size:11px}.actions{display:flex;gap:7px}.danger{background:#fff0f0;color:#a22;border:1px solid #f2cccc;padding:7px;border-radius:7px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}.msg{color:#b33;margin:8px 0}.product-form{max-width:760px}@media(max-width:850px){.side{position:static;width:100%;height:auto;display:flex;overflow:auto;gap:5px}.side h2{display:none}.side button{white-space:nowrap;width:auto}.main{margin:0}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}}
</style></head><body><div id="login" class="login"><div class="card"><h1>Ocean Roid</h1><p>Admin dashboard</p><form id="loginForm"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button class="btn" style="width:100%">Sign in</button></form><div id="loginMsg" class="msg"></div></div></div><div id="app" class="app"><aside class="side"><h2>Ocean Roid</h2><button data-page="dashboard" class="active">Dashboard</button><button data-page="orders">Orders</button><button data-page="products">Products</button><button data-page="customers">Customers</button><button data-page="reports">Reports</button><button onclick="logout()">Logout</button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><p id="subtitle">Your store at a glance.</p></div><a href="/" target="_blank">View store ↗</a></div><section id="content"></section></main></div><script src="/admin/admin.js"></script></body></html>
